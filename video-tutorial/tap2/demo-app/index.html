<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnDesk</title>
<link rel="stylesheet" href="fonts/be-vietnam-pro/400.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/700.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/800.css">
<style>
:root{--ink:#0B1324;--mute:#64748B;--line:#E7EAF0;--bg:#F4F6FA;--pri:#0D9488;--pri2:#14B8A6;--acc:#F59E0B;--gold1:#F8E3A3;--gold2:#C99A2E;--nav:#0B1324}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.ph{font-size:15px;padding:0 18px 110px}
.hd{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.hd .hi{font-size:13px;color:var(--mute);font-weight:500}.hd .nm{font-size:21px;font-weight:800;letter-spacing:-.4px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FDE68A,#F59E0B);display:grid;place-items:center;font-weight:800;color:#78350F;font-size:14px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.bell{margin-left:auto;width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(15,23,42,.06);position:relative}
.bell:after{content:"";position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid #fff}
.hero{position:relative;border-radius:26px;overflow:hidden;height:300px;box-shadow:0 20px 40px rgba(11,19,36,.25)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,19,36,0) 25%,rgba(11,19,36,.92) 100%)}
.hero .in{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;color:#fff}
.kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.kick i{width:7px;height:7px;border-radius:50%;background:#2DD4BF}
.hero h3{font-size:22px;font-weight:800;line-height:1.2;margin-top:10px;letter-spacing:-.3px}
.hero .meta{font-size:12.5px;opacity:.8;margin-top:6px}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}.pbar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#2DD4BF,#5EEAD4);border-radius:3px}
.hero .play{position:absolute;right:20px;top:20px;z-index:2;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.st{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.st .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.st b{display:block;font-size:19px;font-weight:800;margin-top:8px;letter-spacing:-.3px}.st span{font-size:11.5px;color:var(--mute)}
.sec{display:flex;align-items:baseline;margin:24px 0 12px}.sec h2{font-size:18px;font-weight:800;letter-spacing:-.3px}.sec a{margin-left:auto;font-size:13px;color:var(--pri);font-weight:700}
.row{display:flex;gap:12px;overflow:hidden}
.tc{flex:0 0 172px;height:232px;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(11,19,36,.16)}
.tc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}
.tc .tx{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;color:#fff}.tc .tx small{font-size:10.5px;font-weight:700;letter-spacing:1px;opacity:.85}.tc .tx b{display:block;font-size:14.5px;line-height:1.25;margin-top:3px}
.tc .bd{position:absolute;top:10px;left:10px;z-index:2;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:#fff;color:var(--ink)}
.cats{display:flex;gap:8px;overflow:hidden}
.cat{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.cat img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.tab{position:fixed;left:14px;right:14px;bottom:16px;height:68px;border-radius:24px;background:rgba(11,19,36,.92);backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:center;box-shadow:0 14px 30px rgba(11,19,36,.35)}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#94A3B8;font-weight:600}.tab div.on{color:#5EEAD4}
.vid{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;background:#000;box-shadow:0 16px 36px rgba(11,19,36,.28)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,19,36,.88) 0%,rgba(11,19,36,.45) 55%,rgba(11,19,36,.1))}
.vid .ov{position:absolute;left:7%;top:12%;z-index:2;color:#fff}.vid .ov small{font-size:10px;font-weight:800;letter-spacing:2px;color:#5EEAD4}.vid .ov b{display:block;font-size:22px;line-height:1.1;margin-top:5px;letter-spacing:-.4px}
.vid .ctl{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 14px;display:flex;align-items:center;gap:10px;color:#fff;font-size:11px}
.vid .tl{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px}.vid .tl i{display:block;width:38%;height:100%;background:#2DD4BF;border-radius:2px}
.tt{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:16px;line-height:1.25}.tsub{font-size:13px;color:var(--mute);margin-top:4px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:#fff;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.chip img{width:16px;height:16px}
.tabs{display:flex;gap:18px;margin-top:16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--mute)}.tabs span{padding-bottom:10px}.tabs .on{color:var(--ink);border-bottom:3px solid var(--pri)}
.chl{margin-top:12px;background:#fff;border-radius:20px;padding:6px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.chl div{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;font-size:13.5px;font-weight:600}
.chl div.now{background:#F0FDFA}
.chl .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#F1F5F9;color:var(--mute);flex-shrink:0}
.chl .d{background:var(--pri);color:#fff}.chl .now .n{background:var(--ink);color:#fff}
.chl em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12px;font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:18px;font-weight:800;font-size:15.5px;margin-top:16px}
.cta.g{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#3B2600;box-shadow:0 10px 24px rgba(245,158,11,.35)}.cta.t{background:var(--ink);color:#fff}
.qtop{display:flex;align-items:center;gap:12px;padding:18px 0}
.seg{flex:1;display:flex;gap:4px}.seg i{flex:1;height:6px;border-radius:3px;background:#E2E8F0}.seg i.d{background:var(--pri)}.seg i.c{background:var(--ink)}
.ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--acc) 0 77%,#FDE68A 77%);display:grid;place-items:center}.ring div{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:800}
.qimg{height:150px;border-radius:20px;overflow:hidden;position:relative}.qimg img{width:100%;height:100%;object-fit:cover}
.qn{font-size:12px;font-weight:800;color:var(--pri);letter-spacing:1.5px;margin-top:16px}
.qq{font-size:19px;font-weight:800;line-height:1.38;letter-spacing:-.2px;margin-top:6px}
.op{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:#fff;font-size:14.5px;font-weight:600;line-height:1.35;margin-top:10px;box-shadow:0 2px 8px rgba(15,23,42,.05);border:2px solid transparent}
.op b{width:32px;height:32px;border-radius:11px;background:#F1F5F9;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.op.s{border-color:var(--pri);background:#F0FDFA}.op.s b{background:var(--pri);color:#fff}
.res{margin:0 -18px;padding:26px 18px 30px;background:radial-gradient(circle at 50% 0%,#134E4A,#0B1324 70%);color:#fff;text-align:center;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.res .cf i{position:absolute;width:8px;height:14px;border-radius:2px;opacity:.9}
.big{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:8px;background:linear-gradient(180deg,#fff,#99F6E4);-webkit-background-clip:text;color:transparent}
.res .lb{font-size:13px;opacity:.75}
.pass{display:inline-flex;gap:7px;align-items:center;margin-top:12px;padding:8px 16px;border-radius:999px;background:rgba(45,212,191,.18);color:#5EEAD4;font-weight:800;font-size:13px}
.cert{border-radius:24px;background:linear-gradient(135deg,#0B1324,#1E293B);color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(11,19,36,.35)}
.cert:before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(248,227,163,.55);border-radius:18px}
.cert .k{font-size:10.5px;letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,var(--gold1),var(--gold2));-webkit-background-clip:text;color:transparent}
.cert .n{font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-.5px}
.cert .c{font-size:12.5px;color:#CBD5E1;margin-top:4px;max-width:78%}
.cert .md{position:absolute;right:18px;top:18px;width:64px;height:64px;border-radius:50%;background:conic-gradient(from 30deg,#F8E3A3,#C99A2E,#F8E3A3,#B7862A,#F8E3A3);display:grid;place-items:center;box-shadow:0 6px 18px rgba(201,154,46,.45)}
.cert .md div{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#FCE9B2,#D9A93F);display:grid;place-items:center}
.cert .ft{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:11.5px;color:#94A3B8}
.qr{width:48px;height:48px;background:#fff;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:3px;border-radius:6px}.qr i{background:#0B1324}.qr i.o{background:transparent}
.login{min-height:100vh;position:relative;color:#fff;overflow:hidden}
.login img.bgp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,19,36,.15) 0%,rgba(11,19,36,.75) 45%,#0B1324 75%)}
.login .in{position:absolute;left:24px;right:24px;bottom:40px;z-index:2}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2DD4BF,#0D9488);display:grid;place-items:center;box-shadow:0 6px 16px rgba(13,148,136,.4)}
.login h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-1px;margin-top:22px}
.login p{font-size:14.5px;color:#CBD5E1;margin-top:10px}
.fld{margin-top:16px;height:54px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:0 16px;font-size:15px;color:#fff}
.fld.f{border-color:#2DD4BF;box-shadow:0 0 0 4px rgba(45,212,191,.18)}
.login .cta{background:linear-gradient(135deg,#2DD4BF,#0D9488);color:#fff;box-shadow:0 12px 26px rgba(13,148,136,.45)}
.dk{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--nav);color:#CBD5E1;padding:26px 18px;display:flex;flex-direction:column;gap:6px}
.side .logo{color:#fff;margin-bottom:26px}
.side div.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;font-weight:600}
.side div.it.on{background:rgba(45,212,191,.14);color:#5EEAD4}
.side .ico{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;opacity:.8}
.main{padding:26px 32px}
.dg{display:grid;grid-template-columns:1fr 320px;gap:24px}
.dhero{position:relative;height:300px;border-radius:28px;overflow:hidden;box-shadow:0 20px 40px rgba(11,19,36,.2)}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,19,36,.92) 0%,rgba(11,19,36,.55) 50%,rgba(11,19,36,0) 80%)}
.dhero .in{position:absolute;left:34px;top:40px;z-index:2;color:#fff;max-width:520px}.dhero h3{font-size:34px;line-height:1.12;letter-spacing:-.8px;margin-top:12px}
.dhero .pbar{width:360px}
.dhero .btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:13px 22px;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:14.5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gc{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.gc .im{height:140px;position:relative}.gc .im img{width:100%;height:100%;object-fit:cover}.gc .im span{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.95)}
.gc .b{padding:12px 14px 14px}.gc .b b{font-size:14.5px;line-height:1.3;display:block;min-height:38px}.gc .b small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.gc .pr{height:5px;background:#EEF2F7;border-radius:3px;margin-top:10px}.gc .pr i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.card h4{font-size:15px;font-weight:800;margin-bottom:12px}
.lbr{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;font-weight:600}.lbr .r{width:22px;font-weight:800;color:var(--mute)}.lbr .a{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}.lbr em{margin-left:auto;font-style:normal;font-weight:800}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kp .card b{font-size:30px;font-weight:800;letter-spacing:-1px;display:block;margin-top:4px}.kp .card span{font-size:13px;color:var(--mute);font-weight:600}.kp .card em{font-style:normal;font-size:12px;font-weight:800;color:#16A34A}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid #F1F5F9}
.pp{display:inline-flex;align-items:center;gap:8px}.pp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;font-style:normal}
.stt{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800}.stt.ok{background:#DCFCE7;color:#166534}.stt.go{background:#E0F2FE;color:#075985}.stt.no{background:#F1F5F9;color:#475569}
.mini{display:inline-block;width:90px;height:6px;border-radius:3px;background:#EEF2F7;vertical-align:middle;margin-right:8px}.mini i{display:block;height:100%;border-radius:3px;background:var(--pri)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CAP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>';
const LOGO=`<div class="logo"><i>${CAP}</i>LearnDesk</div>`;
const PLAY=(c='#0B1324',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z" fill="${c}"/></svg>`;
const CK=(c='#fff',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const FLAME='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#F97316"/></svg>';
const STAR=(c='#F59E0B',s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z" fill="${c}"/></svg>`;
const MEDAL='<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="14" r="6" fill="#0D9488"/><path d="M8 2h3l1 6-4-1zM16 2h-3l-1 6 4-1z" fill="#14B8A6"/></svg>';
const C=[{t:'Tư vấn bán hàng cho phòng khám nha khoa',g:'KỸ NĂNG BÁN HÀNG',i:'dental',p:62,n:'6 bài · 48 phút'},{t:'Vật liệu trám composite: từ A đến Z',g:'KIẾN THỨC SẢN PHẨM',i:'tooth',p:100,n:'8 bài · 1 giờ 10'},{t:'Tư vấn tẩy trắng răng',g:'KỸ NĂNG BÁN HÀNG',i:'whitening',p:30,n:'5 bài · 35 phút'},{t:'Thiết bị khám mắt cơ bản',g:'KIẾN THỨC SẢN PHẨM',i:'ophth',p:15,n:'6 bài · 50 phút'},{t:'Hội nhập nhân viên mới',g:'HỘI NHẬP',i:'meeting',p:0,n:'4 bài · 25 phút'},{t:'Quy trình kiểm soát chất lượng',g:'QUY TRÌNH',i:'inspect',p:0,n:'5 bài · 40 phút'},{t:'An toàn trong phòng mổ',g:'QUY TRÌNH',i:'surgery',p:0,n:'3 bài · 20 phút'},{t:'Làm việc cùng đội ngũ bác sĩ',g:'KỸ NĂNG',i:'care',p:0,n:'4 bài · 30 phút'}];
const img=n=>`<img src="img/${n}.jpg">`;
const isD=innerWidth>900;
const AV=['#0D9488','#6366F1','#F59E0B','#EF4444','#0EA5E9','#8B5CF6','#10B981'];
const STATS=()=>`<div class="stats">${[[FLAME,'7','ngày liên tiếp','#FFF7ED'],[STAR(),'1.240','điểm','#FFFBEB'],[MEDAL,'3','chứng chỉ','#F0FDFA']].map(([i,b,s,c])=>`<div class="st"><div class="ic" style="background:${c}">${i}</div><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
const tabbar=on=>`<div class="tab">${[['Trang chủ','M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['Khám phá','M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM21 21l-4.5-4.5'],['Học','M4 5h12v14H4zM16 9l4-2v10l-4-2'],['Chứng chỉ','M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z'],['Tôi','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6']].map(([n,d])=>`<div class="${n===on?'on':''}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${n}</div>`).join('')}</div>`;
const side=on=>`<div class="side">${LOGO}${['Trang chủ','Khoá học','Bài kiểm tra','Chứng chỉ','Quản lý'].map(n=>`<div class="it ${n===on?'on':''}"><span class="ico"></span>${n}</div>`).join('')}</div>`;
