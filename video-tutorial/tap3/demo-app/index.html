<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldMap</title>
<link rel="stylesheet" href="fonts/be-vietnam-pro/400.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/700.css"><link rel="stylesheet" href="fonts/be-vietnam-pro/800.css">
<style>
:root{--ink:#16243A;--mute:#6B7686;--line:#E6E2D8;--bg:#F6F3EC;--coral:#E4572E;--blue:#2E86AB;--green:#2A9D6F;--amber:#F2A541;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.ph{padding:0 18px 30px;font-size:15px}
.bar{display:flex;align-items:center;gap:12px;padding:18px 0 12px}
.bk{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(22,36,58,.07)}
.bar h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.bar .sp{margin-left:auto;font-size:12px;font-weight:700;color:var(--mute)}
.cust{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:12px;box-shadow:0 2px 10px rgba(22,36,58,.06)}
.cust img{width:62px;height:62px;border-radius:16px;object-fit:cover}
.cust b{font-size:15.5px;display:block}.cust small{font-size:12.5px;color:var(--mute)}
.gps{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--green);background:#E6F5EE;padding:4px 9px;border-radius:999px}
.lbl{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--mute);margin:14px 0 8px}
.photos{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:96px 96px;gap:8px}
.photos img{width:100%;height:100%;object-fit:cover;border-radius:14px}.photos img:first-child{grid-row:span 2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{padding:8px 13px;border-radius:12px;background:#fff;font-size:13px;font-weight:700;border:1.5px solid var(--line)}
.ch.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:14px;padding:4px;gap:4px;box-shadow:0 2px 8px rgba(22,36,58,.05)}
.seg span{text-align:center;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute)}.seg span.on{background:var(--amber);color:#3B2400}
.note{background:#fff;border-radius:16px;padding:13px 14px;font-size:14px;line-height:1.5;box-shadow:0 2px 8px rgba(22,36,58,.05)}
.next{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(22,36,58,.05);font-size:14px;font-weight:700}
.next i{width:38px;height:38px;border-radius:12px;background:#FDEEE8;display:grid;place-items:center;font-style:normal}
.btn{margin-top:18px;height:54px;border-radius:17px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15.5px;box-shadow:0 10px 24px rgba(228,87,46,.35)}
/* hồ sơ */
.cover{position:relative;height:210px;margin:0 -18px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,36,58,.1),rgba(22,36,58,.85))}
.cover .in{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}.cover h2{font-size:24px;font-weight:800;letter-spacing:-.4px}.cover small{font-size:12.5px;opacity:.85}
.pill{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--amber);color:#3B2400}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st3 div{background:#fff;border-radius:16px;padding:11px;box-shadow:0 2px 8px rgba(22,36,58,.05)}.st3 b{display:block;font-size:18px;font-weight:800}.st3 span{font-size:11.5px;color:var(--mute)}
.tl{position:relative;margin-top:6px;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#DDD6C8}
.ev{position:relative;background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(22,36,58,.05)}
.ev:before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,#2E86AB);border:3px solid var(--bg)}
.ev .h{display:flex;font-size:12px;color:var(--mute);font-weight:700}.ev .h em{margin-left:auto;font-style:normal}
.ev b{display:block;font-size:14px;margin-top:4px}.ev p{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.45}
.ev .im{display:flex;gap:6px;margin-top:8px}.ev .im img{width:74px;height:54px;border-radius:9px;object-fit:cover}
/* desktop quản lý */
.dk{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C9D2DE;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;margin-bottom:22px}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--coral);display:grid;place-items:center}
.side div.it{padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600}.side div.it.on{background:rgba(255,255,255,.1);color:#fff}
.main{padding:24px 28px}
.top{display:flex;align-items:center}.top h2{font-size:24px;font-weight:800;letter-spacing:-.5px}.top small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.top .wk{margin-left:auto;display:flex;gap:6px}.top .wk span{padding:8px 14px;border-radius:10px;background:#fff;font-size:13px;font-weight:700}.top .wk span.on{background:var(--ink);color:#fff}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.kp>div{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(22,36,58,.05)}.kp span{font-size:12.5px;color:var(--mute);font-weight:700}.kp b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.kp .pb{height:6px;border-radius:3px;background:#EEEAE1;margin-top:8px}.kp .pb i{display:block;height:100%;border-radius:3px}
.g2{display:grid;grid-template-columns:1fr 360px;gap:14px;margin-top:14px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(22,36,58,.05)}.card h4{font-size:15px;font-weight:800;margin-bottom:12px}
.cal{display:grid;grid-template-columns:120px repeat(5,1fr);gap:6px;font-size:12px}
.cal .hd{font-weight:800;color:var(--mute);text-align:center;padding-bottom:4px}
.cal .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}.cal .nm i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800}
.cal .cell{min-height:58px;background:#FAF8F3;border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:4px}
.cal .ev2{border-radius:7px;padding:4px 6px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px;font-weight:700}.rk span{width:92px}.rk .bb{flex:1;height:10px;border-radius:5px;background:#EEEAE1}.rk .bb i{display:block;height:100%;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PIN='<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#fff"/></svg>';
const BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16243A" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
const img=n=>`<img src="img/${n}.jpg">`;
const R={
checkin:()=>`<div class="ph"><div class="bar"><div class="bk">${BACK}</div><h1>Ghi nhận viếng thăm</h1><span class="sp">08:42</span></div>
 <div class="cust">${img('dental')}<div><b>Nha khoa Minh Châu</b><small>45 Trần Duy Hưng, Cầu Giấy</small><br><span class="gps">● Đã định vị tại phòng khám</span></div></div>
 <div class="lbl">ẢNH TẠI PHÒNG KHÁM</div><div class="photos">${img('dental')}${img('tooth')}${img('care')}</div>
 <div class="lbl">MỤC ĐÍCH</div><div class="chips"><span class="ch on">Giới thiệu sản phẩm</span><span class="ch">Báo giá</span><span class="ch on">Demo</span><span class="ch">Thu nợ</span></div>
 <div class="lbl">KẾT QUẢ</div><div class="seg"><span>Chưa</span><span class="on">Quan tâm</span><span>Chốt đơn</span></div>
 <div class="lbl">NỘI DUNG TRAO ĐỔI</div><div class="note">Bác sĩ Hoa quan tâm vật liệu trám nano, xin báo giá 2 hộp. Hẹn demo tại phòng khám tuần sau.</div>
 <div class="lbl">LẦN GẶP TỚI</div><div class="next"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4572E" stroke-width="2.2"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></i>Thứ Năm, 21/11 · 9:00</div>
 <div class="btn">Lưu ghi nhận</div></div>`,
profile:()=>`<div class="ph"><div class="cover">${img('dental')}<div class="in"><h2>Nha khoa Minh Châu</h2><small>BS. Nguyễn Thu Hoa · Cầu Giấy, Hà Nội</small><br><span class="pill">Cần gặp lại · 21/11</span></div></div>
 <div class="st3"><div><b>128 tr</b><span>doanh số 2026</span></div><div><b>9</b><span>lần gặp</span></div><div><b>3/4</b><span>follow-up đúng hạn</span></div></div>
 <div class="lbl">LỊCH SỬ CHĂM SÓC</div><div class="tl">
 <div class="ev" style="--c:#E4572E"><div class="h">Viếng thăm · Demo<em>11/11/2026</em></div><b>Quan tâm vật liệu trám nano</b><p>Xin báo giá 2 hộp, hẹn demo 21/11.</p><div class="im">${img('dental')}${img('tooth')}${img('care')}</div></div>
 <div class="ev" style="--c:#2E86AB"><div class="h">Gọi điện · Báo giá<em>28/10/2026</em></div><b>Gửi báo giá dòng tẩy trắng</b><p>Chờ phản hồi sau hội thảo.</p></div>
 <div class="ev" style="--c:#2A9D6F"><div class="h">Đơn hàng<em>15/10/2026</em></div><b>24 triệu · vật liệu trám</b><p>Giao trong 2 ngày.</p></div>
 <div class="ev" style="--c:#E4572E"><div class="h">Viếng thăm lần đầu<em>02/10/2026</em></div><b>Giới thiệu công ty, sản phẩm</b><div class="im">${img('meeting')}${img('inspect')}</div></div></div></div>`,
manager:()=>{const reps=[['Minh','#E4572E'],['Lan','#2E86AB'],['Đức','#2A9D6F'],['Hà','#F2A541'],['Bảo','#7B61FF']];
 const ev={Minh:[['NK Minh Châu','PK An Phát'],['BV Mắt Ánh Dương'],['NK Hoa Sen','NK Thiện Tâm'],['Họp đội'],['NK Kim Ngân']],Lan:[['PK Bình Minh'],['NK Việt Mỹ','NK Lan Anh'],[],['BV Hòa An'],['NK Tâm Đức','PK Phúc Lâm']],Đức:[['Hải Phòng · 3 khách'],[],['Hải Dương · 2 khách'],['NK Nụ Cười'],[]],Hà:[[],['Bắc Ninh · 2 khách'],['PK Hạnh Phúc'],['BV Mắt Sao Mai'],['Báo cáo tuần']],Bảo:[['Nam Định · 2 khách'],['Ninh Bình'],[],['PK Mắt Thanh Bình'],['NK Kim Ngân']]};
 return `<div class="dk"><div class="side"><div class="logo"><i>${PIN}</i>FieldMap</div>${['Bản đồ','Khách hàng','Lịch làm việc','KPI','Cài đặt'].map((n,i)=>`<div class="it ${i==2?'on':''}">${n}</div>`).join('')}</div>
 <div class="main"><div class="top"><div><h2>Lịch làm việc của đội</h2><small>Tuần 18–22/11 · dữ liệu minh hoạ</small></div><div class="wk"><span>Ngày</span><span class="on">Tuần</span><span>Tháng</span></div></div>
 <div class="kp">${[['Viếng thăm tuần','46/50','#E4572E',92],['Khách mới','12','#2E86AB',60],['Doanh số ước tính','1,24 tỷ','#2A9D6F',74],['Follow-up đúng hạn','87%','#F2A541',87]].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b><div class="pb"><i style="width:${x[3]}%;background:${x[2]}"></i></div></div>`).join('')}</div>
 <div class="g2"><div class="card"><h4>Lịch tuần</h4><div class="cal"><div></div>${['T2 18','T3 19','T4 20','T5 21','T6 22'].map(d=>`<div class="hd">${d}</div>`).join('')}
 ${reps.map(([n,c])=>`<div class="nm"><i style="background:${c}">${n[0]}</i>${n}</div>${ev[n].map(cell=>`<div class="cell">${cell.map(e=>`<div class="ev2" style="background:${c}">${e}</div>`).join('')}</div>`).join('')}`).join('')}</div></div>
 <div class="card"><h4>KPI viếng thăm</h4>${[['Minh',96,'#E4572E'],['Lan',88,'#2E86AB'],['Đức',74,'#2A9D6F'],['Hà',81,'#F2A541'],['Bảo',69,'#7B61FF']].map(r=>`<div class="rk"><span>${r[0]}</span><div class="bb"><i style="width:${r[1]}%;background:${r[2]}"></i></div><b>${r[1]}%</b></div>`).join('')}
 <h4 style="margin-top:18px">Doanh số ước tính</h4><svg viewBox="0 0 320 120" width="100%"><polyline points="0,100 50,88 100,92 150,70 200,62 250,45 320,30" fill="none" stroke="#2A9D6F" stroke-width="4" stroke-linecap="round"/><polyline points="250,45 320,30" fill="none" stroke="#2A9D6F" stroke-width="4" stroke-dasharray="8 8"/>${[0,50,100,150,200,250].map((x,i)=>`<circle cx="${x}" cy="${[100,88,92,70,62,45][i]}" r="4" fill="#2A9D6F"/>`).join('')}</svg></div></div></div></div>`;}
};
document.getElementById('app').innerHTML=(R[location.hash.slice(1)]||R.checkin)();
</script>
</body>
</html>
