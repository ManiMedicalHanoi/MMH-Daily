name: Nhân vật — tạo ảnh nháp
on:
  workflow_dispatch:
    inputs:
      only: { description: 'id nhân vật (cách dấu phẩy, trống = tất cả)', required: false, default: '' }
permissions: { contents: read }
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/mascots.mjs mascot-out "${{ inputs.only }}"
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mascots, path: mascot-out, retention-days: 7 }
